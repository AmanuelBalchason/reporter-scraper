name: Run Amharic Scraper # Name displayed on GitHub Actions tab

on:
  # Schedule to run automatically (example: once a day at 3:30 AM UTC)
  # Use crontab guru (https://crontab.guru/) to find the right schedule.
  schedule:
    - cron: '30 3 * * *' # 3:30 UTC daily

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest # Use a standard Linux runner environment

    steps:
      # 1. Get the code from your repository
      - name: Checkout code
        uses: actions/checkout@v4 # Use a specific version of the checkout action

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5 # Use a specific version
        with:
          python-version: '3.10' # Match the Python version you use locally if possible

      # 3. Install required Python libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run your scraper script
      - name: Run the scraper
        run: python reporter_scraper.py # Execute your main script file

      # 5. Commit the updated data file back to the repository
      # This uses a pre-made action to handle adding, committing, and pushing
      - name: Commit report # new or updated data file
        run: |
           git config --global user.name 'GitHub Action Scraper' # Set commit author name
           git config --global user.email 'action@github.com'     # Set commit author email
           git add *.jsonl                                       # Add ALL .jsonl files (use specific name if preferred)
           # Commit only if there are changes, otherwise exit gracefully
           git commit -am "Automated scrape results update $(date)" || exit 0
           git push
        # If the step above fails due to permissions, you might need
        # to adjust repo settings (Actions -> General -> Workflow Permissions -> Read and Write)
        # OR use a different commit/push action like 'ad-m/github-push-action@master'
        # with a PAT (Personal Access Token) - this is more complex and less secure initially.